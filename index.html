 ds:"Datenschutz", imp:"Impressum",
 ds_text:`<h4>Kurz gesagt</h4><p>Rifaq Noor braucht kein Konto, zeigt keine Werbung und verwendet keine Analyse- oder Tracking-Dienste. Verantwortlich ist der im Impressum genannte Anbieter.</p>
<h4>Was auf deinem Gerät bleibt</h4><ul><li>Lesestand, Lesezeichen, Hörstelle, Tasbih, Einstellungen und Khatmas, die du nicht online stellst.</li><li>Dein Standort, für Gebetszeiten und Qibla. Ortsname und Ortssuche ermittelt das Betriebssystem (Apple bzw. Google).</li><li>„Sure erkennen“ nutzt das Mikrofon nur, solange du es startest, über die Spracherkennung des Betriebssystems (Apple bzw. Google). Den Abgleich mit dem Quran macht die App auf dem Gerät; nichts davon geht an uns.</li></ul>
<h4>Quran- und Dua-Inhalte</h4><p>Texte, Übersetzungen und Dua-Aufnahmen kommen über unseren eigenen Server (Cloudflare Workers). Dabei wird technisch deine IP-Adresse verarbeitet; wir speichern keine Protokolle. Die Anbieter der Inhalte sehen nur unseren Server. Quran-Rezitationen lädt die App direkt von den Rezitationsanbietern (Quran.com, EveryAyah), die dabei deine IP-Adresse erhalten.</p>
<h4>Gemeinsame Khatma (nur wenn du sie online stellst)</h4><p>Dafür nutzen wir Google Firebase (anonyme Anmeldung, Firestore). Gespeichert werden Name der Khatma, dein angegebener Lesername, ein optionales Bild und der Stand der Juz. Wer den Link hat, sieht diese Angaben. Du kannst die Khatma jederzeit löschen. Rechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO. Google kann Daten auch in den USA verarbeiten (EU-Standardvertragsklauseln bzw. EU-US Data Privacy Framework).</p>
<h4>Testfassungen</h4><p>Bei TestFlight bzw. Firebase App Distribution verarbeiten Apple bzw. Google Angaben zu Installation, Abstürzen und Rückmeldungen, die du selbst sendest.</p>
<h4>Deine Rechte</h4><p>Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch und Beschwerde bei einer Aufsichtsbehörde (z. B. Landesbeauftragter für den Datenschutz Baden-Württemberg). Kontakt: rifaqnoor@proton.me</p><p style="color:var(--muted)">Stand: 20. November 2026</p>`,
 imp_text:`<p style="color:var(--muted)">Angaben gemäß § 5 DDG</p><h4>Anbieter</h4><p>Mohamed Ali Hussein<br>Daimlerstraße 10<br>79585 Steinen, Deutschland</p><h4>Kontakt</h4><p>E-Mail: rifaqnoor@proton.me</p><h4>Umsatzsteuer-ID</h4><p>DE402063042</p><h4>Streitbeilegung</h4><p>Wir sind nicht bereit und nicht verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.</p><h4>Haftung</h4><p>Inhalte und berechnete Gebetszeiten wurden mit Sorgfalt erstellt; für Richtigkeit und Vollständigkeit können wir keine Gewähr übernehmen.</p>`,

function setLang(lang) {
  const d = T[lang] || T.de;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-k]').forEach(el => { const v = d[el.dataset.k]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  try { localStorage.setItem('rn-lang', lang); } catch (e) {}
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
let start = 'de';
try { start = localStorage.getItem('rn-lang') || (navigator.language || 'de').slice(0, 2); } catch (e) {}
setLang(T[start] ? start : 'de');

// 30 Juz im Handy: 18 gelesen, 7 vergeben, 5 frei
const juz = document.getElementById('juz');
for (let i = 0; i < 30; i++) { const el = document.createElement('i'); if (i < 18) el.className = 'r'; else if (i < 25) el.className = 'g'; juz.appendChild(el); }

// Khatma-Raster: füllt sich beim Ansehen
const g30 = document.getElementById('grid30');
const cells = [];
for (let i = 1; i <= 30; i++) { const c = document.createElement('span'); c.textContent = i; g30.appendChild(c); cells.push(c); }
let filled = false;
function fillBoard() {
  if (filled) return; filled = true;
  const order = [1,5,2,9,14,3,20,7,11,25,4,17,6,22,8,28,12,19];
  order.forEach((n, k) => setTimeout(() => { cells[n - 1].className = 'r'; document.getElementById('bar').style.width = ((k + 1) / 30 * 100) + '%'; }, 120 * k));
  [10,13,15,16,21,24,27].forEach((n, k) => setTimeout(() => { cells[n - 1].className = 'g'; }, 120 * order.length + 160 * k));
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  if (e.target.classList.contains('board')) fillBoard();
  io.unobserve(e.target);
}), { threshold: .15 }) : null;
document.querySelectorAll('.fade').forEach(el => io ? io.observe(el) : el.classList.add('in'));
if (!io) fillBoard();
// Sicherheitsnetz: nach 2,5 s alles sichtbar (Vorschaubilder, alte Browser)
setTimeout(() => { document.querySelectorAll('.fade').forEach(el => el.classList.add('in')); fillBoard(); }, 2500);

// Direktlink auf Datenschutz/Impressum: Abschnitt aufklappen
function openFromHash() { const el = document.getElementById(location.hash.slice(1)); if (el && el.tagName === 'DETAILS') { el.open = true; el.scrollIntoView(); } }
addEventListener('hashchange', openFromHash); openFromHash();

// Funkelnde Sterne über dem Panorama
(function () {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stars = Array.from({ length: 60 }, () => [Math.random(), Math.random() * 0.6, Math.random() * 1.2 + 0.3, Math.random() * 6]);
  function size() { const r = canvas.getBoundingClientRect(); canvas.width = r.width * devicePixelRatio; canvas.height = r.height * devicePixelRatio; }
  function draw(t) {
    const w = canvas.width, h = canvas.height, d = devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    for (const [x, y, s, p] of stars) {
      const a = 0.25 + 0.55 * Math.max(0, Math.sin(t / 700 + p));
      ctx.fillStyle = 'rgba(255,240,200,' + a + ')';
      ctx.beginPath(); ctx.arc(x * w, y * h, s * d, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener('resize', size); requestAnimationFrame(draw);
})();
</script>
